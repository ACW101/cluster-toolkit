apiVersion: slinky.slurm.net/v1alpha1
kind: NodeSet
metadata:
  name: {{ .Values.nodeset.name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
  labels:
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version | quote }}
    app.kubernetes.io/name: slurmd
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: compute
    app.kubernetes.io/part-of: slurm
    nodeset.slinky.slurm.net/name: {{ .Values.nodeset.name }}
spec:
  clusterName: slurm
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  replicas: {{ .Values.nodeset.replicas }}
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: slurmd
      nodeset.slinky.slurm.net/name: {{ .Values.nodeset.name }}
  serviceName: slurm-compute
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: slurmd
      labels:
        nodeset.slinky.slurm.net/name: {{ .Values.nodeset.name }}
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - -g
        - --
        - bash
        - -c
        - |
          mkdir -p /usr/local/lib/slurm
          ln -s  /usr/lib/x86_64-linux-gnu/slurm/spank_pyxis.so /usr/local/lib/slurm/spank_pyxis.so
          /usr/local/bin/entrypoint.sh -Z --conf-server {{ .Values.slurm.controllerName }}:6825 -N $NODE_NAME
        command:
        - tini
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_CPUS
          value: "0"
        - name: POD_MEMORY
          value: "0"
        image: {{ .Values.slurmdImage | quote }}
        imagePullPolicy: IfNotPresent
        name: slurmd
        ports:
        - containerPort: 6818
          name: slurmd
          protocol: TCP
        readinessProbe:
          exec:
            command:
            - scontrol
            - show
            - slurmd
        resources: {}
        securityContext:
          capabilities:
            add:
            - BPF
            - NET_ADMIN
            - SYS_ADMIN
            - SYS_NICE
          privileged: true
        volumeMounts:
        - mountPath: /etc/slurm
          name: etc-slurm
        - mountPath: /run
          name: run
        - mountPath: /var/spool/slurmd
          name: slurm-spool
        - mountPath: /var/log/slurm
          name: slurm-log
        # - mountPath: /home
        #   name: home-pvc
      dnsConfig:
        searches:
        - {{ .Values.slurm.controllerName }}
      hostNetwork: true
      initContainers:
      - command:
        - tini
        - -g
        - --
        - bash
        - -c
        - |
          #!/usr/bin/env bash
          # SPDX-FileCopyrightText: Copyright (C) SchedMD LLC.
          # SPDX-License-Identifier: Apache-2.0

          set -euo pipefail

          # Assume env contains:
          # SLURM_USER - username or UID

          function init::common() {
          	local dir

          	dir=/var/spool/slurmd
          	mkdir -p "$dir"
          	chown -v "${SLURM_USER}:${SLURM_USER}" "$dir"
          	chmod -v 700 "$dir"

          	dir=/var/spool/slurmctld
          	mkdir -p "$dir"
          	chown -v "${SLURM_USER}:${SLURM_USER}" "$dir"
          	chmod -v 700 "$dir"
          }

          function init::slurm() {
          	SLURM_MOUNT=/mnt/slurm
          	SLURM_DIR=/mnt/etc/slurm

          	# Workaround to ephemeral volumes not supporting securityContext
          	# https://github.com/kubernetes/kubernetes/issues/81089

          	# Copy Slurm config files, secrets, and scripts
          	mkdir -p "$SLURM_DIR"
          	find "${SLURM_MOUNT}" -type f -name "*.conf" -print0 | xargs -0r cp -vt "${SLURM_DIR}"
          	find "${SLURM_MOUNT}" -type f -name "*.key" -print0 | xargs -0r cp -vt "${SLURM_DIR}"
          	find "${SLURM_MOUNT}" -type f -regextype posix-extended -regex "^.*/(pro|epi)log-.*$" -print0 | xargs -0r cp -vt "${SLURM_DIR}"
          	find "${SLURM_MOUNT}" -type f -regextype posix-extended -regex "^.*/(pro|epi)log-.*$" -print0 | xargs -0r cp -vt "${SLURM_DIR}"

          	# Set general permissions and ownership
          	find "${SLURM_DIR}" -type f -print0 | xargs -0r chown -v "${SLURM_USER}:${SLURM_USER}"
          	find "${SLURM_DIR}" -type f -name "*.conf" -print0 | xargs -0r chmod -v 644
          	find "${SLURM_DIR}" -type f -name "*.key" -print0 | xargs -0r chmod -v 600
          	find "${SLURM_DIR}" -type f -regextype posix-extended -regex "^.*/(pro|epi)log-.*$" -print0 | xargs -0r chown -v "${SLURM_USER}:${SLURM_USER}"
          	find "${SLURM_DIR}" -type f -regextype posix-extended -regex "^.*/(pro|epi)log-.*$" -print0 | xargs -0r chmod -v 755

          	# Inject secrets into certain config files
          	local dbd_conf="slurmdbd.conf"
          	if [[ -f "${SLURM_MOUNT}/${dbd_conf}" ]]; then
          		echo "Injecting secrets from environment into: ${dbd_conf}"
          		rm -f "${SLURM_DIR}/${dbd_conf}"
          		envsubst <"${SLURM_MOUNT}/${dbd_conf}" >"${SLURM_DIR}/${dbd_conf}"
          		chown -v "${SLURM_USER}:${SLURM_USER}" "${SLURM_DIR}/${dbd_conf}"
          		chmod -v 600 "${SLURM_DIR}/${dbd_conf}"
          	fi

          	# Display Slurm directory files
          	ls -lAF "${SLURM_DIR}"
          }

          function main() {
          	init::common
          	init::slurm
          }
          main
        env:
        - name: SLURM_USER
          value: slurm
        image: {{ .Values.slurmdImage | quote }}
        imagePullPolicy: IfNotPresent
        name: init
        resources: {}
        volumeMounts:
        - mountPath: /mnt/slurm
          name: slurm-config
        - mountPath: /mnt/etc/slurm
          name: etc-slurm
      - command:
        - tini
        - -g
        - --
        - bash
        - -c
        - |
          #!/usr/bin/env bash
          # SPDX-FileCopyrightText: Copyright (C) SchedMD LLC.
          # SPDX-License-Identifier: Apache-2.0

          set -euo pipefail

          # Assume env contains:
          # SOCKET - Named socket to read from

          mkdir -v -p "$(dirname "$SOCKET")"
          rm -f "$SOCKET"
          if ! [ -f "$SOCKET" ]; then
          	mkfifo -m 777 "$SOCKET"
          fi
          while IFS="" read data; do
          	echo $data
          done <"$SOCKET"
        env:
        - name: SOCKET
          value: /var/log/slurm/slurmd.log
        image: {{ .Values.logfileImage | quote }}
        imagePullPolicy: IfNotPresent
        name: logfile
        resources: {}
        restartPolicy: Always
        volumeMounts:
        - mountPath: /var/log/slurm
          name: slurm-log
      nodeSelector:
        cloud.google.com/gke-nodepool: {{ .Values.nodeset.nodePool | quote }}
      tolerations:
      - effect: NoSchedule
        key: nvidia.com/gpu
        operator: Equal
        value: present
      volumes:
      - emptyDir:
          medium: Memory
        name: etc-slurm
      - emptyDir: {}
        name: run
      - name: slurm-config
        persistentVolumeClaim:
          claimName: {{ .Values.nodeset.configPvc }}
      - emptyDir:
          medium: Memory
        name: slurm-spool
      - emptyDir:
          medium: Memory
        name: slurm-log
      # - name: home-pvc
      #   persistentVolumeClaim:
      #     claimName: {{ .Values.nodeset.homePvc }}
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 20%
    type: RollingUpdate